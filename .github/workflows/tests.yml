name: tests

# A cadeia inteira roda a cada push, em qualquer branch, e em cada pull request
# (inclusive de fork). O grupo de concorrencia cancela a execucao anterior do
# mesmo ref, para o push em cima de um PR nao pagar a corrida duas vezes.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # O runner nao sobe MySQL: a cadeia de qualidade roda sobre SQLite, e o
    # `phpunit.xml` ja forca `:memory:` na suite. Variavel de ambiente real tem
    # precedencia sobre o `.env` que o `composer setup` copia do exemplo.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Create the database file
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Migrate from scratch
        run: php artisan migrate:fresh --seed --force

      - name: Run CI Checks
        run: composer ci:check
